<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Private Chat App 1.0 </title>

    <!-- jQuery + jQuery UI -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="dashboard">
        <h1> Welcome, login to continue. </h1>
        <button type="button" class="loginBtn" id="loginBtn"> Login with Google </button>
        <button type="button" class="addChatBtn" id="addChatBtn"> + New Chat </button> 
        <button type="button" class="logoutBtn" id="logoutBtn"> Logout </button> 
        <p class="userInfo" id="userInfo"> not logged in </p>
    </div>

    <div class="pinboard", id="pinboard"></div>

    <script type="module" src="script2.js"></script>
</body>
</html>
